<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Gallery - Omics-GEM Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #f5576c;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }
        .image-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }
        .image-card:hover {
            transform: translateY(-5px);
        }
        .image-card img {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .image-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="../" class="back-btn">← Back to Home</a>
            <h1>🎨 Workflow Gallery</h1>
            <p>Visual mockups of workflow stages and analysis pipelines</p>
        </header>
        
        <div class="gallery" id="gallery">
            <p style="color: white; text-align: center; grid-column: 1/-1;">Loading workflow images...</p>
        </div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const images = [
            'stage1_resource_curation.png',
            'stage2_model_building.png',
            'stage3_analysis.png'
        ];

        fetch('.')
            .then(r => r.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = Array.from(doc.querySelectorAll('a'))
                    .map(a => a.getAttribute('href'))
                    .filter(href => href && (href.endsWith('.png') || href.endsWith('.jpg') || href.endsWith('.jpeg')));
                
                if (links.length === 0) {
                    gallery.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">No workflow images found. Add .png or .jpg files to the ui_mockups folder.</p>';
                    return;
                }
                
                gallery.innerHTML = '';
                links.forEach((img, i) => {
                    const card = document.createElement('div');
                    card.className = 'image-card';
                    card.innerHTML = `
                        <img src="${img}" alt="Workflow ${i + 1}" onerror="this.parentElement.style.display='none'">
                        <h3>Workflow Stage ${i + 1}</h3>
                        <p style="color: #666;">Analysis pipeline visualization</p>
                    `;
                    gallery.appendChild(card);
                });
            })
            .catch(() => {
                gallery.innerHTML = '<p style="color: white; text-align: center; grid-column: 1/-1;">Unable to load images. Please check the ui_mockups directory.</p>';
            });
    </script>
</body>
</html>
