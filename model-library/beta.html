<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Library | BiGG Metabolic Model Strain Atlas</title>
  <style>
    :root {
      --bg-0: #f5fcff;
      --bg-1: #eaf8fb;
      --panel: rgba(255, 255, 255, 0.66);
      --line: rgba(31, 132, 151, 0.22);
      --text: #0b2533;
      --muted: #55727b;
      --cyan: #1ab7d0;
      --teal: #10b790;
      --amber: #f2a333;
      --shadow: 0 24px 70px rgba(16, 79, 94, 0.16);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      padding: 28px;
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(26, 183, 208, 0.22), transparent 30%),
        radial-gradient(circle at 88% 10%, rgba(242, 163, 51, 0.18), transparent 30%),
        linear-gradient(120deg, var(--bg-0), var(--bg-1) 56%, #fbf7ff);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(31, 132, 151, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(31, 132, 151, 0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.85), transparent 84%);
    }
    .atlas-shell {
      position: relative;
      z-index: 1;
      width: min(1680px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }
    .atlas-hero,
    .tree-container,
    .legend-panel {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.78), rgba(244,253,255,0.44));
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .atlas-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 22px 24px;
      overflow: hidden;
    }
    .atlas-kicker {
      color: #0d6772;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    h1 {
      margin: 8px 0 0;
      font-size: clamp(28px, 3.8vw, 54px);
      line-height: 0.96;
      letter-spacing: -0.03em;
    }
    .atlas-hero p {
      max-width: 760px;
      margin: 12px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }
    .hero-stat {
      min-width: 190px;
      padding: 14px 16px;
      border: 1px solid rgba(31, 132, 151, 0.16);
      border-radius: 12px;
      background: rgba(255,255,255,0.52);
    }
    .hero-stat span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .hero-stat strong {
      display: block;
      margin-top: 5px;
      font-size: 20px;
    }
    .tree-container {
      padding: 18px;
      overflow: auto;
    }
    .tree-container svg {
      width: max(1280px, 100%);
      height: auto;
      display: block;
      border-radius: 10px;
      background: rgba(255,255,255,0.38);
    }
    .legend-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      color: var(--muted);
      font-size: 13px;
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 30px;
      padding: 6px 10px;
      border: 1px solid rgba(31,132,151,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.5);
      color: var(--text);
      font-weight: 800;
      font-size: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 12px rgba(26, 183, 208, 0.38);
    }
    .dot.orange { background: #e67e22; }
    .dot.green { background: #27ae60; }
    .dot.violet { background: #8e44ad; }
    .custom-tooltip {
      position: fixed;
      max-width: 290px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 12px;
      line-height: 1.55;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      background: rgba(9, 28, 48, 0.94);
      box-shadow: 0 18px 44px rgba(9, 28, 48, 0.28);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease;
      z-index: 9999;
      backdrop-filter: blur(14px);
    }
    @media (max-width: 860px) {
      body { padding: 14px; }
      .atlas-hero { grid-template-columns: 1fr; }
      .tree-container svg { width: 1180px; }
    }
  </style>
</head>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const strainDescriptions = {

            "MG1655 BW25113": "Products: <br>🧴 1,4-BDO (Bioplastic),<br>🍋 Succinic acid,<br>💊 Artemisinic acid,<br>💊 Shikimic acid (Tamiflu)",
            "W3110": "Products: <br>🧬 L-Valine,<br>🧬 L-Phenylalanine",
            "DH Series": "Products: <br>🧬 Plasmid DNA,<br>💉 mRNA vaccine",

            "REL606": "Products: <br>🔬 Recombinant protein",
            "BL21 DE3": "Products: <br>💉 Human insulin,<br>💉 Interferon α/β,<br>✂️ Cas9 / sgRNA,<br>🧪 Taq polymerase,<br>⚠️ Toxic proteins",

            "W NCDC8177": "Products: <br>♻️ PHB bioplastic,<br>🧬 L-Valine (industrial),<br>⛽ Sucrose → fuel",
            "W KO11": "Products: <br>⛽ Biofuel ethanol",

            "C Crooks": "Products: <br>🧬 L-Phenylalanine,<br>🌸 Specialty aromatics,<br>🦠 Phage vector",


            "S288C": "Products: <br>⛽ Fuel ethanol,<br>🍦 Vanillin,<br>💉 Hepatitis B vaccine,<br>💊 Artemisinin",
            "CHO DG44": "Products: <br>💉 PD-1 mAb",
            "CCAP1055 1": "Products: <br>🐟 EPA (omega-3),<br>🐟 DHA (omega-3),<br>⛽ Biofuel (esters/H₂)",
            "CC-125": "Products: <br>⛽ Biofuel (esters/H₂)",


            "KT2440": "Products: <br>♻️ PHA bioplastics,<br>🌍 Solvent bioremediation,<br>🌍 Microplastic degradation",
            "str 168": "Products: <br>🧪 Alkaline proteases,<br>🌟 Riboflavin (B2)",
            "MG1363": "Products: <br>🧂 Nisin,<br>🧀 Cheese fermentation",
            "DSM13528": "Products: <br>⛽ CO₂/syngas → ethanol,<br>🧪 Acetic acid",
            "PCC6803": "Products: <br>⛽ CO₂ → Isobutanol,<br>🧪 CO₂ → Lactate",


            "Recon cells": "Products: <br>🔬 Diabetes research,<br>🔬 Cancer metabolism",
            "O157H7 UTI89":"Products: <br>🦠 UTI pathway, <br>🦠 Diarrhea pathway",
            "H37Rv CDC1551": "Products: <br>💊 Anti - TB drug",
            "P falciparum": "Products: <br>💊 Anti-malarial",
            "MRSA strains": "Products: <br>🦠 MRSA mechanism,<br>💊 Antibiotic bypass"
        };

        const tooltip = document.getElementById("tree-tooltip");

        // 獲取 SVG 內所有的文字標籤
        const textNodes = document.querySelectorAll("svg text");

        textNodes.forEach(node => {
            const textContent = node.textContent.trim();

            if (strainDescriptions[textContent]) {
                const parentGroup = node.closest("g");
                if (parentGroup) parentGroup.style.cursor = "pointer";
                node.style.cursor = "pointer";

                node.addEventListener("mouseenter", function (e) {
                    tooltip.innerHTML = `<strong>${textContent}</strong><br>${strainDescriptions[textContent].replaceAll(', ', '<br>')}`;
                    tooltip.style.opacity = "1";
                });

                node.addEventListener("mousemove", function (e) {
                    tooltip.style.left = (e.clientX + 15) + "px";
                    tooltip.style.top = (e.clientY + 15) + "px";
                });

                node.addEventListener("mouseleave", function () {
                    tooltip.style.opacity = "0";
                });

                if (parentGroup) {
                    parentGroup.addEventListener("mouseenter", () => {
                        tooltip.innerHTML = `<strong>${textContent}</strong><br>${strainDescriptions[textContent].replaceAll(', ', '<br>')}`;
                        tooltip.style.opacity = "1";
                    });
                    parentGroup.addEventListener("mousemove", (e) => {
                        tooltip.style.left = (e.clientX + 15) + "px";
                        tooltip.style.top = (e.clientY + 15) + "px";
                    });
                    parentGroup.addEventListener("mouseleave", () => tooltip.style.opacity = "0");
                }
            }
        });
    });</script>
